name: create tag and release on merge pr

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: set config tag and release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::warning::$TAG already exists: nothing to release (VERSION was not bumped)"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "VERSION=$VERSION"
            echo "TAG_NAME=$TAG"
            echo "RELEASE_NAME=LAN Remote Desktop $TAG"
            [[ "$VERSION" == *-* ]] && echo "PRERELEASE=true" || echo "PRERELEASE=false"
          } >> "$GITHUB_ENV"
          # PR text goes through env + a file, never straight into the script
          printf '%s\n\n%s\n' "${PR_TITLE#Release $TAG - }" "${PR_BODY//\[...autoGenerate\]/}" > release-notes.md

      - name: build the source tarball
        if: env.SKIP != 'true'
        run: |
          NAME="devkit-lan-remote-desktop-$VERSION"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$NAME/" -o "dist/$NAME.tar.gz" HEAD
          (cd dist && sha256sum "$NAME.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: create tag and release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --generate-notes \
            --prerelease="$PRERELEASE" \
            --latest="$([[ $PRERELEASE == true ]] && echo false || echo true)"
