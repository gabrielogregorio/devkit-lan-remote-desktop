<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>remote-link</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="overlay">
      <div class="card">
        <h1>remote&#8209;link</h1>
        <p id="status">conectando…</p>
        <button id="connect">Conectar</button>
      </div>
    </div>
  </div>

  <div id="bar">
    <button id="menuToggle" title="menu">⚙</button>
    <span class="group">
      <label>preset</label>
      <select id="preset"></select>
    </span>
    <span class="group">
      <label>resolução</label>
      <select id="vres"></select>
    </span>
    <span class="group">
      <label>fps</label>
      <select id="vfps"></select>
    </span>
    <span class="group">
      <label>bitrate</label>
      <select id="vbitrate"></select>
    </span>
    <span class="group">
      <label>áudio</label>
      <select id="audioPreset"></select>
    </span>
    <span class="group">
      <label>monitor</label>
      <select id="monitor"></select>
    </span>
    <button id="sound" title="ligar/desligar áudio">🔇 som</button>
    <button id="lock" title="capturar mouse (jogos/FPS)">🎯 mouse</button>
    <button id="kbd" title="teclado virtual">⌨</button>
    <button id="remapBtn" title="remapear controle (PS2/USB)">🎮</button>
    <button id="remapClear" title="resetar mapeamento (volta a passar direto)">🎮↺</button>
    <button id="full" title="tela cheia">⛶</button>
    <span class="group combos">
      <label>atalhos</label>
      <button data-combo="altf4" title="fechar janela ativa">Alt+F4</button>
      <button data-combo="alttab" title="alternar janelas">Alt+Tab</button>
      <button data-combo="ctrlaltdel" title="Ctrl+Alt+Del">C+A+Del</button>
      <button data-combo="super" title="menu de atividades (Super)">Super</button>
    </span>
    <span id="stats" class="stats">-</span>
  </div>

  <div id="osk" class="hidden"></div>

  <div id="remap" class="hidden">
    <div class="card">
      <h2 id="remapTitle">Remapear controle</h2>
      <p id="remapPrompt">Acione o controle…</p>
      <div class="remap-actions">
        <button id="remapSkip">Pular</button>
        <button id="remapCancel">Cancelar</button>
      </div>
      <p class="remap-hint">Dica: para controles PS2/USB, siga cada passo
        apertando o botão/direção pedido. O perfil fica salvo no servidor.</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
