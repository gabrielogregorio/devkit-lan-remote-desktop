<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>LAN Remote Desktop · gamepad diagnostics</title>
  <style>
    body { background:#0b0d10; color:#e7edf3; font:14px ui-monospace,monospace;
           margin:0; padding:16px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#7d8794; margin:0 0 16px; }
    .pad { border:1px solid #232a33; border-radius:10px; padding:12px;
           margin-bottom:16px; }
    .id { color:#3da9fc; word-break:break-all; }
    .map { color:#2ecc71; }
    table { border-collapse:collapse; width:100%; margin-top:8px; }
    td { padding:2px 8px; border-bottom:1px solid #1a1f26; font-variant-numeric:tabular-nums; }
    .lbl { color:#7d8794; width:90px; }
    .bar { display:inline-block; height:10px; background:#3da9fc; border-radius:3px;
           vertical-align:middle; }
    .on { color:#2ecc71; font-weight:700; }
    .off { color:#3a424d; }
    .cols { display:flex; gap:24px; flex-wrap:wrap; }
    .col { flex:1; min-width:280px; }
    .hint { background:#15191f; padding:10px; border-radius:8px; margin-top:8px; }
  </style>
</head>
<body>
  <h1 data-i18n>Gamepad diagnostics</h1>
  <p data-i18n-html>Move EVERYTHING on the controller (sticks, triggers all the way down, D-Pad,
     buttons). The values that change are the real indices the browser reports.
     <b>Take a screenshot of this</b> with the LT and RT triggers half pressed.</p>
  <div id="out" data-i18n>Connect a controller and press any button…</div>

<script src="/i18n.js"></script>
<script>
// Same strings as the main page: English is the key, pt-BR comes from i18n.js.
const I18N = window.I18N;
const LANG = I18N.detectLanguage(location.search, navigator.languages || [navigator.language]);
const t = I18N.translator(LANG);
I18N.translatePage(document, LANG);

const out = document.getElementById("out");

function pct(v) { return Math.round(v * 100); }
function bar(v) {
  const w = Math.max(0, Math.min(100, ((v + 1) / 2) * 100)); // -1..1 -> 0..100 for axes
  return `<span class="bar" style="width:${w}px"></span>`;
}
function barUnit(v) {
  const w = Math.max(0, Math.min(100, v * 100)); // 0..1
  return `<span class="bar" style="width:${w}px"></span>`;
}

// per-controller history: for each button/axis, keeps the min/max seen and how
// many times it "oscillated" (went up and down). That is what exposes a buggy trigger.
const hist = {}; // key: padIndex -> {btn:[{min,max,flips,last,dir}], axis:[...]}
function track(slot, i, v, store) {
  if (!store[i]) store[i] = { min: v, max: v, flips: 0, last: v, dir: 0 };
  const h = store[i];
  if (v < h.min) h.min = v;
  if (v > h.max) h.max = v;
  const dv = v - h.last;
  if (Math.abs(dv) > 0.02) {
    const nd = dv > 0 ? 1 : -1;
    if (h.dir !== 0 && nd !== h.dir) h.flips++; // changed direction = oscillation
    h.dir = nd;
  }
  h.last = v;
  return h;
}

function render() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let html = "";
  let any = false;
  for (const p of pads) {
    if (!p) continue;
    any = true;
    if (!hist[p.index]) hist[p.index] = { btn: {}, axis: {} };
    const H = hist[p.index];
    html += `<div class="pad">`;
    html += `<div class="id">id: ${p.id}</div>`;
    html += `<div>mapping: <span class="map">${p.mapping || t("(empty / NOT standard)")}</span>`;
    html += ` · ${t("buttons: {buttons} · axes: {axes}", { buttons: p.buttons.length, axes: p.axes.length })}</div>`;
    html += `<div class="cols">`;

    // buttons
    html += `<div class="col"><table><tr><td class="lbl">${t("button")}</td><td></td>`
      + `<td>${t("value")}</td><td>min..max</td><td>osc.</td><td></td></tr>`;
    p.buttons.forEach((b, i) => {
      const h = track("btn", i, b.value, H.btn);
      const cls = b.pressed ? "on" : "off";
      const flip = h.flips > 3 ? `<span class="on">${h.flips}⚠</span>` : h.flips;
      html += `<tr><td class="lbl">btn[${i}]</td>`
        + `<td class="${cls}">${b.pressed ? "▮" : "▯"}</td>`
        + `<td>${b.value.toFixed(3)}</td>`
        + `<td>${h.min.toFixed(2)}..${h.max.toFixed(2)}</td>`
        + `<td>${flip}</td>`
        + `<td>${barUnit(b.value)}</td></tr>`;
    });
    html += `</table></div>`;

    // axes
    html += `<div class="col"><table><tr><td class="lbl">${t("axis")}</td>`
      + `<td>${t("value")}</td><td>min..max</td><td>osc.</td><td></td></tr>`;
    p.axes.forEach((v, i) => {
      const h = track("axis", i, v ?? 0, H.axis);
      const flip = h.flips > 3 ? `<span class="on">${h.flips}⚠</span>` : h.flips;
      html += `<tr><td class="lbl">axis[${i}]</td>`
        + `<td>${(v ?? 0).toFixed(3)}</td>`
        + `<td>${h.min.toFixed(2)}..${h.max.toFixed(2)}</td>`
        + `<td>${flip}</td>`
        + `<td>${bar(v ?? 0)}</td></tr>`;
    });
    html += `</table></div>`;

    html += `</div></div>`;
  }
  if (any) {
    html += `<div class="hint">${t('For a real Xbox, expect: mapping = "standard", btn[6]/btn[7] = LT/RT triggers (value from 0 to 1), btn[12..15] = D-Pad, axis[0..3] = sticks. If yours shows an empty mapping and the triggers as axes, it is a non-standard controller (it needs the remap).')}</div>`;
    out.innerHTML = html;
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
